server.port=${SERVER_PORT:8082}

# Los valores después de ":" son solo el respaldo para desarrollo local.
# En un ambiente real (servidor de despliegue), estas se definen como
# variables de entorno del sistema operativo y Spring Boot las toma
# automáticamente sin tocar este archivo. Ver docs/05-despliegue.md.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/concorde_springboot}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:DACR2008}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Clave para firmar los tokens JWT (ver JwtUtil). En producción esta
# variable de entorno SIEMPRE debe definirse con un valor propio y
# secreto; el valor de respaldo es solo para no romper el entorno de
# desarrollo de cada estudiante.
concorde.jwt.secret=${JWT_SECRET:concorde-transporte-terrestre-clave-secreta-para-firmar-tokens-jwt-cambiar-en-produccion}
